<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="游戏系统策划作品集">
  <title>游戏系统策划作品集</title>
  <style>
    :root{
      --bg:#101624;
      --panel:#161d2d;
      --text:#f4f6fa;
      --muted:#adb5c5;
      --line:rgba(255,255,255,.09);
      --accent:#7860d8;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      color:var(--text);
      background:var(--bg);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }

    .shell{
      width:min(720px,calc(100% - 32px));
      margin:auto;
    }

    .home{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:48px 0;
    }

    h1{
      margin:0 0 32px;
      font-size:28px;
    }

    .statement{
      padding:24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }

    .statement h2{
      margin:0 0 10px;
      font-size:17px;
    }

    .statement p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.8;
    }

    .entry{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-top:16px;
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      color:var(--text);
      text-decoration:none;
    }

    .entry strong{
      display:block;
      font-size:18px;
    }

    .entry span{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }

    .arrow{
      color:#bbaeff;
      font-size:22px;
    }

    .works{
      min-height:100vh;
      padding:64px 0;
      border-top:1px solid var(--line);
    }

    .back{
      display:inline-block;
      margin-bottom:26px;
      color:var(--muted);
      text-decoration:none;
      font-size:13px;
    }

    .works h2{
      margin:0;
      font-size:28px;
    }

    .works-note{
      margin:6px 0 28px;
      color:var(--muted);
      font-size:13px;
    }

    .empty{
      min-height:220px;
      display:grid;
      place-items:center;
      padding:28px;
      text-align:center;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }

    .empty strong{
      display:block;
      margin-bottom:6px;
      font-size:17px;
    }

    .empty span{
      color:var(--muted);
      font-size:13px;
    }
  </style>
</head>
<body>

  <section class="home" id="home">
    <main class="shell">
      <h1>游戏系统策划作品集</h1>

      <section class="statement">
        <h2>作品声明</h2>
        <p>本作品集仅用于个人求职及专业能力展示，所有展示内容均为本人独立整理的脱敏版本。</p>
      </section>

      <a class="entry" href="#system-design">
        <div>
          <strong>系统设计作品</strong>
          <span>System Design Works</span>
        </div>
        <div class="arrow">→</div>
      </a>
    </main>
  </section>

  <section class="works" id="system-design">
    <main class="shell">
      <a class="back" href="#home">← 返回首页</a>
      <h2>系统设计作品</h2>
      <p class="works-note">所有展示内容均为脱敏版本。</p>

      <section class="empty">
        <div>
          <strong>作品整理中</strong>
          <span>后续直接在这里添加作品链接或作品内容。</span>
        </div>
      </section>
    </main>
  </section>

</body>
</html>
