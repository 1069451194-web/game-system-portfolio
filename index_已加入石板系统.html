<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="游戏系统策划作品集">
  <title>游戏系统策划作品集</title>
  <style>
    :root{
      --bg:#101624;
      --panel:#161d2d;
      --text:#f4f6fa;
      --muted:#adb5c5;
      --line:rgba(255,255,255,.09);
      --accent:#7860d8;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      background:var(--bg);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }
    .shell{
      width:min(980px,calc(100% - 32px));
      margin:auto;
    }
    .home{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:48px 0;
    }
    .home .shell{max-width:720px}
    h1{margin:0 0 32px;font-size:28px}
    .statement{
      padding:24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }
    .statement h2{margin:0 0 10px;font-size:17px}
    .statement p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.8;
    }
    .entry{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-top:16px;
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      color:var(--text);
      text-decoration:none;
    }
    .entry strong{display:block;font-size:18px}
    .entry span{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }
    .arrow{color:#bbaeff;font-size:22px}
    .works{
      min-height:100vh;
      padding:64px 0 80px;
      border-top:1px solid var(--line);
    }
    .back{
      display:inline-block;
      margin-bottom:26px;
      color:var(--muted);
      text-decoration:none;
      font-size:13px;
    }
    .works h2{margin:0;font-size:28px}
    .works-note{
      margin:6px 0 28px;
      color:var(--muted);
      font-size:13px;
    }
    .work-card{
      padding:20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }
    .work-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
    }
    .work-head h3{margin:0 0 3px;font-size:18px}
    .work-head span{color:var(--muted);font-size:12px}
    .badge{
      padding:5px 9px;
      border-radius:999px;
      color:#cfc5ff;
      background:rgba(120,96,216,.13);
      border:1px solid rgba(120,96,216,.25);
      white-space:nowrap;
    }
    .preview{
      display:block;
      overflow:hidden;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
      cursor:zoom-in;
    }
    .preview img{
      display:block;
      width:100%;
      height:auto;
    }
    .copyright{
      margin:12px 2px 0;
      color:#8892a5;
      font-size:11px;
      line-height:1.7;
    }
    dialog{
      width:min(96vw,1800px);
      max-width:none;
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      color:var(--text);
      background:#0b101b;
    }
    dialog::backdrop{background:rgba(0,0,0,.82)}
    dialog img{display:block;width:100%;height:auto}
    .close{
      display:block;
      margin:0 0 10px auto;
      padding:7px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      color:var(--text);
      background:var(--panel);
      cursor:pointer;
    }
    @media(max-width:620px){
      .work-head{display:block}
      .badge{display:inline-block;margin-top:8px}
    }
  </style>
</head>
