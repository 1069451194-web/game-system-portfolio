<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="游戏系统策划作品集">
  <title>游戏系统策划作品集</title>
  <style>
    :root{
      --bg:#101624;
      --panel:#161d2d;
      --text:#f4f6fa;
      --muted:#adb5c5;
      --line:rgba(255,255,255,.09);
      --accent:#7860d8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      color:var(--text);
      background:var(--bg);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }
    main{
      width:min(720px,calc(100% - 32px));
    }
    h1{
      margin:0 0 34px;
      font-size:28px;
      letter-spacing:.2px;
    }
    .statement{
      padding:26px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }
    .statement h2{
      margin:0 0 12px;
      font-size:17px;
    }
    .statement p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.8;
    }
    .entry{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-top:16px;
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      color:var(--text);
      text-decoration:none;
      transition:border-color .2s ease,transform .2s ease;
    }
    .entry:hover{
      transform:translateY(-2px);
      border-color:rgba(120,96,216,.62);
    }
    .entry strong{
      display:block;
      font-size:18px;
    }
    .entry span{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }
    .arrow{
      color:#bbaeff;
      font-size:22px;
    }
  </style>
</head>
<body>
  <main>
    <h1>游戏系统策划作品集</h1>

    <section class="statement">
      <h2>作品声明</h2>
      <p>本作品集仅用于个人求职及专业能力展示，所有展示内容均为本人独立整理的脱敏版本。</p>
    </section>

    <a class="entry" href="system-design/">
      <div>
        <strong>系统设计作品</strong>
        <span>System Design Works</span>
      </div>
      <div class="arrow">→</div>
    </a>
  </main>
</body>
</html>
