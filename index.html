<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="游戏系统策划作品集">
  <title>游戏系统策划作品集</title>
  <style>
    :root{
      --bg:#101624;
      --panel:#161d2d;
      --text:#f4f6fa;
      --muted:#adb5c5;
      --line:rgba(255,255,255,.09);
      --accent:#7860d8;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      color:var(--text);
      background:var(--bg);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }

    .shell{
      width:min(980px,calc(100% - 32px));
      margin:auto;
    }

    .home{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:48px 0;
    }

    .home .shell{max-width:720px}

    h1{
      margin:0 0 32px;
      font-size:28px;
    }

    .statement{
      padding:24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }

    .statement h2{
      margin:0 0 10px;
      font-size:17px;
    }

    .statement p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.8;
    }

    .entry{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-top:16px;
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      color:var(--text);
      text-decoration:none;
    }

    .entry strong{
      display:block;
      font-size:18px;
    }

    .entry span{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }

    .arrow{
      color:#bbaeff;
      font-size:22px;
    }

    .works{
      min-height:100vh;
      padding:64px 0 80px;
      border-top:1px solid var(--line);
    }

    .back{
      display:inline-block;
      margin-bottom:26px;
      color:var(--muted);
      text-decoration:none;
      font-size:13px;
    }

    .works h2{
      margin:0;
      font-size:28px;
    }

    .works-note{
      margin:6px 0 28px;
      color:var(--muted);
      font-size:13px;
    }

    .work-card{
      padding:20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }

    .work-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
    }

    .work-head h3{
      margin:0 0 3px;
      font-size:18px;
    }

    .work-head span{
      color:var(--muted);
      font-size:12px;
    }

    .badge{
      padding:5px 9px;
      border-radius:999px;
      color:#cfc5ff;
      background:rgba(120,96,216,.13);
      border:1px solid rgba(120,96,216,.25);
      white-space:nowrap;
    }

    .preview{
      position:relative;
      display:block;
      overflow:hidden;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
      cursor:zoom-in;
      text-decoration:none;
    }

    .preview img{
      display:block;
      width:100%;
      height:auto;
    }

    .preview-tip{
      position:absolute;
      right:12px;
      bottom:12px;
      padding:8px 11px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:8px;
      color:#fff;
      background:rgba(8,12,20,.82);
      font-size:12px;
      backdrop-filter:blur(8px);
      pointer-events:none;
    }

    .preview:hover .preview-tip{
      background:rgba(120,96,216,.92);
    }

    .image-note{
      display:flex;
      justify-content:space-between;
      gap:16px;
      margin:12px 2px 0;
      color:#8892a5;
      font-size:11px;
      line-height:1.7;
    }

    .image-note a{
      color:#bbaeff;
      text-decoration:none;
    }

    .image-note a:hover{
      text-decoration:underline;
    }

    .copyright{
      margin:8px 2px 0;
      color:#8892a5;
      font-size:11px;
      line-height:1.7;
    }


    .preview-button{
      width:100%;
      padding:0;
      border:1px solid var(--line);
      text-align:left;
      font:inherit;
    }

    .open-text-button{
      padding:0;
      border:0;
      color:#bbaeff;
      background:transparent;
      font:inherit;
      font-size:11px;
      cursor:pointer;
    }

    .open-text-button:hover{text-decoration:underline}

    .image-dialog{
      width:calc(100vw - 24px);
      height:calc(100vh - 24px);
      max-width:none;
      max-height:none;
      margin:auto;
      padding:0;
      border:1px solid var(--line);
      border-radius:14px;
      color:var(--text);
      background:#0b101b;
      overflow:hidden;
    }

    .image-dialog::backdrop{
      background:rgba(0,0,0,.88);
    }

    .dialog-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background:#111827;
    }

    .dialog-toolbar strong{font-size:14px}

    .zoom-controls{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .zoom-controls button{
      min-width:38px;
      height:34px;
      padding:0 10px;
      border:1px solid var(--line);
      border-radius:8px;
      color:var(--text);
      background:var(--panel);
      cursor:pointer;
    }

    .zoom-controls button:hover{background:#242d42}

    .zoom-value{
      min-width:54px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    .image-viewport{
      width:100%;
      height:calc(100% - 55px);
      overflow:auto;
      background:#dde1e8;
      cursor:grab;
    }

    .image-viewport.is-dragging{cursor:grabbing}

    .original-image-wrap{
      width:max-content;
      min-width:100%;
      min-height:100%;
      padding:24px;
    }

    .original-image{
      display:block;
      width:2048px;
      max-width:none;
      height:auto;
      margin:auto;
      transform-origin:top left;
      box-shadow:0 10px 40px rgba(0,0,0,.24);
      user-select:none;
      -webkit-user-drag:none;
    }

    @media(max-width:620px){
      .work-head{display:block}
      .badge{display:inline-block;margin-top:8px}
      .image-note{display:block}
      .preview-tip{right:8px;bottom:8px}
    }
  </style>
</head>
<body>
  <section class="home" id="home">
    <main class="shell">
      <h1>游戏系统策划作品集</h1>

      <section class="statement">
        <h2>作品声明</h2>
        <p>本作品集仅用于个人求职及专业能力展示，所有展示内容均为本人独立整理的脱敏版本。</p>
      </section>

      <a class="entry" href="#system-design">
        <div>
          <strong>系统设计作品</strong>
          <span>System Design Works</span>
        </div>
        <div class="arrow">→</div>
      </a>
    </main>
  </section>

  <section class="works" id="system-design">
    <main class="shell">
      <a class="back" href="#home">← 返回首页</a>
      <h2>系统设计作品</h2>
      <p class="works-note">所有展示内容均为脱敏版本。</p>

      <article class="work-card">
        <div class="work-head">
          <div>
            <h3>石板系统设计</h3>
            <span>系统策划案 · 交互与功能流程</span>
          </div>
          <span class="badge">脱敏版</span>
        </div>

        <button class="preview preview-button"
                id="open-original"
                type="button"
                aria-label="打开石板系统设计高清原图">
          <img
            src="slate-system-original.png"
            width="2048"
            height="1488"
            alt="石板系统设计完整策划长图">
          <span class="preview-tip">点击查看高清原图</span>
        </button>

        <div class="image-note">
          <span>原图尺寸：2048 × 1488；点击后可放大、缩小并拖动查看细节。</span>
          <button class="open-text-button" id="open-original-text" type="button">打开高清原图</button>
        </div>

        <p class="copyright">作品仅用于个人求职展示，禁止转载、传播及商业使用。</p>
      </article>
    </main>
  </section>

  <dialog class="image-dialog" id="image-dialog">
    <div class="dialog-toolbar">
      <strong>石板系统设计 · 高清原图</strong>
      <div class="zoom-controls">
        <button id="zoom-out" type="button" aria-label="缩小">−</button>
        <span class="zoom-value" id="zoom-value">100%</span>
        <button id="zoom-in" type="button" aria-label="放大">＋</button>
        <button id="zoom-reset" type="button">100%</button>
        <button id="close-dialog" type="button">关闭</button>
      </div>
    </div>
    <div class="image-viewport" id="image-viewport">
      <div class="original-image-wrap">
        <img class="original-image"
             id="original-image"
             src="slate-system-original.png"
             width="2048"
             height="1488"
             alt="石板系统设计高清原图">
      </div>
    </div>
  </dialog>

  <script>
    const dialog = document.getElementById("image-dialog");
    const viewport = document.getElementById("image-viewport");
    const originalImage = document.getElementById("original-image");
    const zoomValue = document.getElementById("zoom-value");
    const openButtons = [
      document.getElementById("open-original"),
      document.getElementById("open-original-text")
    ];

    let scale = 1;
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let startScrollLeft = 0;
    let startScrollTop = 0;

    function updateZoom() {
      originalImage.style.width = `${2048 * scale}px`;
      zoomValue.textContent = `${Math.round(scale * 100)}%`;
    }

    function setZoom(nextScale) {
      scale = Math.min(3, Math.max(0.25, nextScale));
      updateZoom();
    }

    function openDialog() {
      setZoom(1);
      dialog.showModal();
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
    }

    openButtons.forEach((button) => button.addEventListener("click", openDialog));

    document.getElementById("zoom-in").addEventListener("click", () => setZoom(scale + 0.25));
    document.getElementById("zoom-out").addEventListener("click", () => setZoom(scale - 0.25));
    document.getElementById("zoom-reset").addEventListener("click", () => setZoom(1));
    document.getElementById("close-dialog").addEventListener("click", () => dialog.close());

    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });

    viewport.addEventListener("mousedown", (event) => {
      dragging = true;
      viewport.classList.add("is-dragging");
      startX = event.clientX;
      startY = event.clientY;
      startScrollLeft = viewport.scrollLeft;
      startScrollTop = viewport.scrollTop;
    });

    window.addEventListener("mousemove", (event) => {
      if (!dragging) return;
      viewport.scrollLeft = startScrollLeft - (event.clientX - startX);
      viewport.scrollTop = startScrollTop - (event.clientY - startY);
    });

    window.addEventListener("mouseup", () => {
      dragging = false;
      viewport.classList.remove("is-dragging");
    });

    viewport.addEventListener("wheel", (event) => {
      if (!event.ctrlKey) return;
      event.preventDefault();
      setZoom(scale + (event.deltaY < 0 ? 0.1 : -0.1));
    }, { passive: false });
  </script>

</body>
</html>
