<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="游戏系统策划作品集">
  <title>游戏系统策划作品集</title>
  <style>
    :root {
      --bg:#101624;
      --panel:#161d2d;
      --text:#f4f6fa;
      --muted:#adb5c5;
      --line:rgba(255,255,255,.09);
      --accent:#7860d8;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      background:var(--bg);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    }
    .shell{
      width:min(980px,calc(100% - 32px));
      margin:auto;
    }
    .home{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:48px 0;
    }
    .home .shell{max-width:720px}
    h1{margin:0 0 32px;font-size:28px}
    .statement{
      padding:24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }
    .statement h2{margin:0 0 10px;font-size:17px}
    .statement p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.8;
    }
    .entry{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-top:16px;
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      color:var(--text);
      text-decoration:none;
    }
    .entry strong{display:block;font-size:18px}
    .entry span{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
    }
    .arrow{color:#bbaeff;font-size:22px}
    .works{
      min-height:100vh;
      padding:64px 0 80px;
      border-top:1px solid var(--line);
    }
    .back{
      display:inline-block;
      margin-bottom:26px;
      color:var(--muted);
      text-decoration:none;
      font-size:13px;
    }
    .works h2{margin:0;font-size:28px}
    .works-note{
      margin:6px 0 28px;
      color:var(--muted);
      font-size:13px;
    }
    .work-card{
      padding:20px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }
    .work-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px;
    }
    .work-head h3{margin:0 0 3px;font-size:18px}
    .work-head span{color:var(--muted);font-size:12px}
    .badge{
      padding:5px 9px;
      border-radius:999px;
      color:#cfc5ff;
      background:rgba(120,96,216,.13);
      border:1px solid rgba(120,96,216,.25);
      white-space:nowrap;
    }
    .preview{
      position:relative;
      display:block;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      cursor:zoom-in;
      text-decoration:none;
    }
    .preview img{
      display:block;
      width:100%;
      height:auto;
    }
    .preview-tip{
      position:absolute;
      right:12px;
      bottom:12px;
      padding:8px 11px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:8px;
      color:#fff;
      background:rgba(8,12,20,.86);
      font-size:12px;
      pointer-events:none;
    }
    .preview:hover .preview-tip{
      background:rgba(120,96,216,.94);
    }
    .image-note{
      display:flex;
      justify-content:space-between;
      gap:16px;
      margin:12px 2px 0;
      color:#8892a5;
      font-size:11px;
      line-height:1.7;
    }
    .image-note a{
      color:#bbaeff;
      text-decoration:none;
    }
    .image-note a:hover{text-decoration:underline}
    .copyright{
      margin:8px 2px 0;
      color:#8892a5;
      font-size:11px;
      line-height:1.7;
    }
    @media(max-width:620px){
      .work-head{display:block}
      .badge{display:inline-block;margin-top:8px}
      .image-note{display:block}
      .preview-tip{right:8px;bottom:8px}
    }
  </style>
</head>
<body>
  <section class="home" id="home">
    <main class="shell">
      <h1>游戏系统策划作品集</h1>

      <section class="statement">
        <h2>作品声明</h2>
        <p>本作品集仅用于个人求职及专业能力展示，所有展示内容均为本人独立整理的脱敏版本。</p>
      </section>

      <a class="entry" href="#system-design">
        <div>
          <strong>系统设计作品</strong>
          <span>System Design Works</span>
        </div>
        <div class="arrow">→</div>
      </a>
    </main>
  </section>

  <section class="works" id="system-design">
    <main class="shell">
      <a class="back" href="#home">← 返回首页</a>
      <h2>系统设计作品</h2>
      <p class="works-note">所有展示内容均为脱敏版本。</p>

      <article class="work-card">
        <div class="work-head">
          <div>
            <h3>石板系统设计</h3>
            <span>系统策划案 · 交互与功能流程</span>
          </div>
          <span class="badge">脱敏版</span>
        </div>

        <a class="preview"
           href="slate-viewer.html"
           target="_blank"
           rel="noopener"
           aria-label="单独打开石板系统原始PNG">
          <img
            src="slate-system-original.png"
            width="2048"
            height="1488"
            alt="石板系统设计原图">
          <span class="preview-tip">点击打开高清查看页 ↗</span>
        </a>

        <div class="image-note">
          <span>使用你上传的2048×1488原始PNG；网页只缩放显示，不修改图片文件。</span>
          <a href="slate-viewer.html" target="_blank" rel="noopener">打开高清查看页</a>
        </div>

        <p class="copyright">作品仅用于个人求职展示，禁止转载、传播及商业使用。</p>
      </article>
    </main>
  </section>
</body>
</html>
